server:
  port: 8080

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    druid:
      driver-class-name: ${teasmile.datasource.driver-class-name}
      url: jdbc:mysql://${teasmile.datasource.host}:${teasmile.datasource.port}/${teasmile.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${teasmile.datasource.username}
      password: ${teasmile.datasource.password}
  redis:
    host: ${teasmile.redis.host}
    port: ${teasmile.redis.port}
    password: ${teasmile.redis.password}
    database: ${teasmile.redis.database}

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.teasmile.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      teasmile:
        mapper: debug
        service: info
        controller: info

teasmile:
  jwt:
    # 管理端 JWT 签名密钥（真实值在 application-dev.yml 中配置，勿提交）
    admin-secret-key: ${teasmile.jwt.admin-secret-key}
    # 管理端令牌有效期（毫秒）
    admin-ttl: 720000000
    # 管理端令牌请求头名称
    admin-token-name: token
    # 用户端 JWT 签名密钥（真实值在 application-dev.yml 中配置，勿提交）
    user-secret-key: ${teasmile.jwt.user-secret-key}
    # 用户端令牌有效期（毫秒）
    user-ttl: 720000000
    # 用户端令牌请求头名称
    user-token-name: authentication
  alioss:
    endpoint: ${teasmile.alioss.endpoint}
    access-key-id: ${teasmile.alioss.access-key-id}
    access-key-secret: ${teasmile.alioss.access-key-secret}
    bucket-name: ${teasmile.alioss.bucket-name}
  wechat:
    appid: ${teasmile.wechat.appid}
    secret: ${teasmile.wechat.secret}
    mchid: ${teasmile.wechat.mchid}
    mchSerialNo: ${teasmile.wechat.mchSerialNo}
    privateKeyFilePath: ${teasmile.wechat.privateKeyFilePath}
    apiV3Key: ${teasmile.wechat.apiV3Key}
    weChatPayCertFilePath: ${teasmile.wechat.weChatPayCertFilePath}
    notifyUrl: ${teasmile.wechat.notifyUrl}
    refundNotifyUrl: ${teasmile.wechat.refundNotifyUrl}
  shop:
    address: 湖南省长沙市岳麓区麓山南路茶颜悦色门店
  baidu:
    ak: ${teasmile.baidu.ak}
